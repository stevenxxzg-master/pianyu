        title: One visual language from the very first visit
        body: Keep the public promise, the account journey, and the trust signals inside one coherent shell.
        points:
          - icon: article
            text: Learn what the community is for before you are asked to commit.
          - icon: chat_bubble
            text: Move from landing page to sign-up without visual whiplash.
