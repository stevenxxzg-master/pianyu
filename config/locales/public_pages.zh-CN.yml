    landing:
      eyebrow: 更柔和的入口，更明确的意图
      heading: "%{site} 把公共入口重做成一个现代、安静、可信任的邀请"
      description: 访客可以在一条连续路径里了解社区、比较使用场景，并进入正确的登录、注册或找回密码流程。
      panel_eyebrow: 入口总览
      panel_title: 从第一眼到第一次登录，只走一条路就够了
      panel_points:
        - icon: explore
          text: 公共前台优先回答“这里是什么、适合谁、下一步去哪里”。
        - icon: diamond
          text: 品牌标识、编辑感排版与图标节奏在所有公共页面上保持一致。
        - icon: key
          text: 登录、注册与密码找回不再像独立工具页，而是同一产品旅程的一部分。
      feature_eyebrow: 新入口解决什么
      feature_title: 把公共层当作产品来设计，而不是补丁页面
      feature_cards:
        - icon: article
          title: 第一屏就说清价值
          text: 落地页在最短时间内告诉访客社区气质、参与方式与推荐入口。
        - icon: group
          title: 用真实信号建立信任
          text: 成员数量、内容规模与联邦连接让访客在注册前先理解这里的温度与体量。
        - icon: safety_check
          title: 让规则与法务随手可见
          text: 帮助、隐私、条款与社区规则始终伴随在路径里，不再藏在无人注意的角落。
      band_eyebrow: 继续了解
      band_title: 先了解、再比较、再提问，最后再加入
      band_body: 去看实例页、帮助页或直接进入认证流程，整个过程都保持在同一品牌壳层里。
    about:
      title: 关于
      eyebrow: 品牌与社区说明
      heading: 为什么这个公共入口会让人更快安心下来
      description: "%{site} 的公共页面被设计成一个完整前台：更清晰、更温和，也更像一个认真经营的产品。"
      principle_eyebrow: 设计原则
      principle_title: 这套公共前台遵守三条简单规则
      principles:
        - icon: quiet_time
          title: 先给秩序，再给动作
          text: 通过留白、分组与文案层级，让访客在决策前先看懂结构。
        - icon: link
          title: 先给上下文，再给表单
          text: 先用实例、规则与帮助解释这里如何运作，再邀请用户输入信息。
        - icon: diamond
          title: 一套品牌语言走到底
          text: 公共页面与认证页面共享相同的字体、材质、图标和按钮节奏。
      story_title: 站点说明
      story_fallback: 这个站点暂时还没有填写更详细的扩展说明。
      meta_title: 信任信息
      meta_admin: 站点管理员
      meta_contact: 联系方式
      meta_contact_missing: 站点暂未公开联系方式。
      rules_title: 社区规则
      rules_empty: 暂时还没有公开的社区规则。
    examples:
      title: 实例
      eyebrow: 使用场景
      heading: "%{site} 最适合承载的几类交流方式"
      description: 用具体场景帮助访客判断这里是否适合自己的节奏、主题与参与深度。
      grid_eyebrow: 场景画布
      grid_title: 四种最适合通过公共入口引导进来的社区样式
      scenarios:
        - icon: sync_alt
          title: 工作协作圈
          text: 适合同行小组、研究伙伴或产品团队，把连续更新与深度讨论留在同一个公共入口下。
        - icon: bookmarks
          title: 阅读与写作沙龙
          text: 适合书单推荐、批注链接与慢节奏长对话，让上下文可以自然积累。
        - icon: edit_square
          title: 创作展示空间
          text: 用统一的品牌前台介绍作品、活动与参与方式，再把访客带进更细的互动场景。
        - icon: public
          title: 议题与行动社区
          text: 把原则、规则、法务和加入入口放在同一视图里，建立更可靠的第一印象。
      path_eyebrow: 还想确认细节？
      path_title: 场景页最好和帮助页一起出现
      path_body: 先用帮助页回答常见疑问，再把访客送进正确的认证入口，路径会更完整。
    help:
      title: 帮助
      eyebrow: 公共支持
      heading: 从好奇到安心，尽量只走最短路径
      description: 公共帮助页回答新访客在注册前、认证中与进入社区后最常遇到的问题。
      quickstart_eyebrow: 快速开始
      quickstart_title: 三步完成一次轻量上手
      quickstart:
        - index: 01
          title: 先看首页
          text: 先通过落地页理解社区气质、品牌表达与推荐入口，再决定是否深入。
        - index: 02
          title: 再看实例
          text: 用实例页比较不同的使用场景，判断这里是否适合自己的参与方式。
        - index: 03
          title: 最后进入认证
          text: 在同一品牌壳层里登录、注册或找回密码，避免来回跳转带来的中断感。
      faq_eyebrow: 常见问题
      faq_title: 新访客最常问的几个问题
      faqs:
        - question: 不登录也能浏览这些公共页面吗？
          answer: 可以。落地页、关于、实例、帮助、隐私与条款都会保持公开，方便访客先评估再决定是否加入。
        - question: 如果当前不开放注册怎么办？
          answer: 公共入口会根据当前注册模式自动调整 CTA，让访客仍然能走向正确的下一步，而不是卡住。
        - question: 隐私和条款会不会很难找？
          answer: 不会。法务入口会在公共前台和页脚同时保留，始终处在容易发现的位置。
      support_eyebrow: 还在确认中？
      support_title: 把信任信息放在最近的地方
      support_body: 先阅读 %{domain} 的隐私与条款，再在准备好之后回到登录或注册入口。
    privacy:
      eyebrow: 隐私政策
      heading: 我们如何处理数据、可见性与访问痕迹
    terms:
      eyebrow: 服务条款
      heading: 使用 %{site} 前需要理解的共同约定
      empty: 当前还没有已发布的服务条款。
    auth:
      reset_password_lead: 输入与你在 %{domain} 使用的邮箱地址，我们会发送一封重置密码邮件。
